# Image is written by HVO (ApplicationWorkflow) as <registry>@<digest>;
# everything else in this file is hand-maintained and must survive its commits.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hvo-demo
  name: hvo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hvo-demo
  template:
    metadata:
      labels:
        app: hvo-demo
    spec:
      containers:
      - image: zot.registry.svc.cluster.local:5000/hvo-demo/web@sha256:fe6dd487928c0242c0dca527e2e69d8f445037890f9ec0b70cc51246dc207eed
        name: web
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
