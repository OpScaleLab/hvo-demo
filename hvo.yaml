# What this app needs from the platform (HVO docs/hvo-yaml.md).
name: hvo-demo
type: web
port: 8080
health: /healthz
size: small
expose:
  host: hvo-demo.nalyx.dev
secrets: [hvo-demo-config, hvo-demo-sealed]   # GREETING; SEALED_GREETING (Keyfold, .hvo/secrets/<env>/)
observe:
  rum: true                # HVO-hosted browser bootstrap; app only loads it
  # Go has no OpenTelemetry Operator auto-instrumentation; this app exports
  # spans with the SDK using the OTEL_* environment HVO sets for every app.
  sessions: true           # HVO-provisioned OpenReplay project per environment
needs:
  postgres:
    size: small
  redis: {}                  # REDIS_URL
  bucket: {}                 # S3_* and AWS_*
